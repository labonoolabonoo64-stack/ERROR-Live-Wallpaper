<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https://www.youtube.com https://www.youtube-nocookie.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com; style-src 'self' 'unsafe-inline';">
<title>ERROR Live Wallpaper</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:#fff;font-family:Segoe UI,Arial,sans-serif}
#yt{position:fixed;inset:0;width:100%;height:100%;border:0;pointer-events:none}
#veil{position:fixed;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.62),rgba(0,0,0,.08) 55%,rgba(0,0,0,.48));pointer-events:none}
#home{position:fixed;left:52px;bottom:48px;width:390px;padding:25px;border:1px solid rgba(255,255,255,.14);border-radius:24px;background:rgba(10,10,14,.58);backdrop-filter:blur(18px);box-shadow:0 20px 60px rgba(0,0,0,.45);pointer-events:auto}
.logo{font-size:12px;letter-spacing:5px;opacity:.62}.title{font-size:34px;font-weight:600;letter-spacing:1px;margin:8px 0 18px}
input{width:100%;padding:14px 16px;border-radius:14px;border:1px solid rgba(255,255,255,.14);outline:0;background:rgba(255,255,255,.08);color:white}
.row{display:flex;gap:10px;margin-top:12px}button{flex:1;padding:12px;border:1px solid rgba(255,255,255,.14);border-radius:13px;background:rgba(255,255,255,.1);color:#fff;cursor:pointer}button:hover{background:rgba(255,255,255,.18)}
#dates{display:none;position:fixed;inset:0;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.datebox{pointer-events:auto}.weekday{font-size:15px;letter-spacing:10px;opacity:.7}.bigdate{font-size:78px;font-weight:300;letter-spacing:5px}.time{font-size:22px;letter-spacing:7px;opacity:.75}.back{margin-top:24px;width:190px}
#mini{position:fixed;right:28px;top:24px;display:flex;gap:8px;pointer-events:auto}#mini button{flex:0 0 auto;padding:8px 12px;border-radius:10px}
</style>
</head>
<body>
<iframe id="yt" allow="autoplay; encrypted-media; picture-in-picture"></iframe>
<div id="veil"></div>

<div id="home">
  <div class="logo">ERROR // LIVE WALLPAPER</div>
  <div class="title">Make your desktop alive.</div>
  <input id="url" placeholder="Paste YouTube video link">
  <div class="row">
    <button onclick="loadYT()">SET WALLPAPER</button>
    <button onclick="dates()">GO TO DATES</button>
  </div>
</div>

<div id="mini">
  <button onclick="home()">LIVE</button>
  <button onclick="dates()">DATES</button>
  <button onclick="window.close()">EXIT</button>
</div>

<div id="dates">
  <div class="datebox">
    <div class="weekday" id="weekday"></div>
    <div class="bigdate" id="bigdate"></div>
    <div class="time" id="time"></div>
    <button class="back" onclick="home()">GO TO LIVE WALLPAPER</button>
  </div>
</div>

<script>
const yt=document.getElementById("yt");
function idFromURL(s){
  try{
    const u=new URL(s);
    if(u.hostname.includes("youtu.be")) return u.pathname.slice(1);
    if(u.searchParams.get("v")) return u.searchParams.get("v");
    const m=u.pathname.match(/\/(shorts|embed)\/([^/?]+)/); return m?m[2]:"";
  }catch(e){return ""}
}
function loadYT(){
  const id=idFromURL(document.getElementById("url").value.trim());
  if(!id) return;
  yt.src=`https://www.youtube-nocookie.com/embed/${id}?autoplay=1&mute=0&controls=0&loop=1&playlist=${id}&rel=0`;
}
function dates(){document.getElementById("home").style.display="none";document.getElementById("dates").style.display="flex"}
function home(){document.getElementById("dates").style.display="none";document.getElementById("home").style.display="block"}
function tick(){
 const d=new Date(),days=["SUNDAY","MONDAY","TUESDAY","WEDNESDAY","THURSDAY","FRIDAY","SATURDAY"];
 const months=["JANUARY","FEBRUARY","MARCH","APRIL","MAY","JUNE","JULY","AUGUST","SEPTEMBER","OCTOBER","NOVEMBER","DECEMBER"];
 document.getElementById("weekday").textContent=days[d.getDay()];
 document.getElementById("bigdate").textContent=String(d.getDate()).padStart(2,"0")+" "+months[d.getMonth()]+" "+d.getFullYear();
 document.getElementById("time").textContent=d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"});
}
setInterval(tick,1000);tick();
</script>
</body>
</html>
